  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cff9b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7cff9b" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7cff9b" stop-opacity="0"/>
